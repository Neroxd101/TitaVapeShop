<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | Tita's Vape Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/components/variables.css">
    <link rel="stylesheet" href="/css/components/resets.css">
    <link rel="stylesheet" href="/css/components/background-effects.css">
    <link rel="stylesheet" href="/css/components/animations.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/alerts.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/modal-layouts.css">
    <link rel="stylesheet" href="/css/components/empty-state.css">
    <link rel="stylesheet" href="/css/components/loading-state.css">
    <link rel="stylesheet" href="/css/components/logo.css">
    <link rel="stylesheet" href="/css/components/footer.css">
    <link rel="stylesheet" href="/navigation/navigation.css">
    <link rel="stylesheet" href="/css/components/main-layout.css">
    <link rel="stylesheet" href="/css/components/page-header.css">
    <link rel="stylesheet" href="/css/components/page-content.css">
    <link rel="stylesheet" href="/css/components/search-box.css">
    <link rel="stylesheet" href="/css/components/filter-tabs.css">
    <link rel="stylesheet" href="/css/components/filters.css">
    <link rel="stylesheet" href="/css/components/table.css">
    <link rel="stylesheet" href="/css/components/pagination.css">
    <link rel="stylesheet" href="/css/components/badges.css">
    <link rel="stylesheet" href="/css/components/page-container.css">
    <link rel="stylesheet" href="/css/components/data-table.css">
    <link rel="stylesheet" href="/css/components/utilities.css">
    <link rel="stylesheet" href="/admin/admin/activity-log/activity-log.css">
</head>

<body>
    <div class="bg-pattern"></div>

    <!-- Sidebar - Loaded dynamically -->
    <div id="navigation-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-container">
            <div class="page-header">
                <h1>Activity Log</h1>
                <p class="subtitle">Monitor system activities</p>
            </div>

            <!-- Filters -->
            <div class="filter-tabs transactions-filter-tabs">
                <div class="filter-tabs-group transactions-filter-group">
                    <select id="filterAction" class="filter-tab transactions-filter-select">
                        <option value="">All Actions</option>
                        <option value="sale_void">Voided Sales</option>
                        <option value="sale_complete">Sales</option>
                        <option value="order_confirm">Order Confirm</option>
                        <option value="order_cancel">Order Cancel</option>
                        <option value="inventory_add">Inventory Add</option>
                        <option value="inventory_edit">Inventory Edit</option>
                        <option value="inventory_delete">Inventory Delete</option>
                    </select>
                    <select id="filterYear" class="filter-tab transactions-filter-select">
                        <option value="">Year</option>
                    </select>
                    <select id="filterMonth" class="filter-tab transactions-filter-select">
                        <option value="">Month</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select id="filterDay" class="filter-tab transactions-filter-select">
                        <option value="">Day</option>
                    </select>
                    <label class="transactions-date-field" for="filterStartDate">From
                        <span class="transactions-date-input"><input type="date" id="filterStartDate" class="filter-tab" data-empty="true"><span class="date-format-hint" aria-hidden="true">MM/DD/YYYY</span></span>
                    </label>
                    <label class="transactions-date-field" for="filterEndDate">To
                        <span class="transactions-date-input"><input type="date" id="filterEndDate" class="filter-tab" data-empty="true"><span class="date-format-hint" aria-hidden="true">MM/DD/YYYY</span></span>
                    </label>
                </div>

                <div class="filter-tabs-actions">
                    <button id="printTransactionsBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                        </svg>
                        <span>Print</span>
                    </button>
                    <button id="resetFiltersBtn" class="btn btn-secondary">Reset</button>
                </div>
            </div>

            <!-- Transactions Table -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="data-table transactions-table">
                        <thead>
                            <tr>
                                <th class="col-time">Time</th>
                                <th class="col-action">Action</th>
                                <th class="col-details">Details</th>
                                <th class="col-user">User</th>
                                <th class="col-amount">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsList">
                            <!-- Rows rendered by transactions.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination / Load More -->
                <div class="pagination-controls">
                    <button id="prevPageBtn" class="btn btn-small" disabled>Previous</button>
                    <span id="pageInfo">Page 1</span>
                    <button id="nextPageBtn" class="btn btn-small">Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/navigation/javascript/navigation.js"></script>
    <!-- Modular Fetchers (Align with Backend) -->
    <script src="/admin/admin/activity-log/javascript/transactions_get_all.js"></script>
    <script src="/admin/admin/activity-log/javascript/transactions_get_stats.js"></script>
    <script src="/admin/admin/activity-log/javascript/transactions_get_report.js"></script>

    <!-- Print Module -->
    <script src="/admin/admin/activity-log/javascript/transactions_print.js"></script>

    <!-- UI & Controller -->
    <script src="/admin/admin/activity-log/javascript/activity-log-controller.js"></script>
</body>

</html>
