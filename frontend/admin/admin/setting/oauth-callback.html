<!DOCTYPE html>
<html>

<head>
    <title>Connecting...</title>
    <style>
        body {
            background: #12121a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');

            if (error) {
                window.opener?.postMessage({ type: 'GOOGLE_AUTH_ERROR', error }, window.location.origin);
                window.close();
                return;
            }

            if (code) {
                try {
                    const response = await fetch('/auth/google/exchange', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, state })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Only non-sensitive display information is stored here.
                        // OAuth tokens remain in HttpOnly cookies managed by the backend.
                        localStorage.setItem('google_user', JSON.stringify(data.user));
                        localStorage.setItem('google_connected', 'true');

                        // Notify via storage event (for other tabs) AND postMessage (for opener direct feedback)
                        window.opener?.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', user: data.user }, window.location.origin);
                    } else {
                        window.opener?.postMessage({ type: 'GOOGLE_AUTH_ERROR', error: data.error }, window.location.origin);
                    }
                } catch (err) {
                    window.opener?.postMessage({ type: 'GOOGLE_AUTH_ERROR', error: err.message }, window.location.origin);
                } finally {
                    window.close();
                }
            }
        })();
    </script>
</body>

</html>
