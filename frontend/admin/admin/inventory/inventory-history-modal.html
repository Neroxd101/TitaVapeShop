<!-- Sales History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal modal-wide history-modal-dialog">
    <!-- Modal Header -->
    <div class="history-modal-header">
      <div class="history-header-left">
        <span class="history-badge">Sales Log</span>
        <h3 class="history-product-name" id="historyProductName">Product Name</h3>
      </div>
      <button type="button" class="modal-close" id="closeHistoryModalBtn" title="Close" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body history-modal-body">
      <!-- Toolbar: Filter Period -->
      <div class="history-toolbar">
        <div class="history-toolbar-header">
          <div class="history-date-label">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/>
            </svg>
            <span>Date Range</span>
          </div>
          <button type="button" id="historyClearDateBtn" class="btn-clear-date" title="Clear date filter" aria-label="Clear date filter">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
            <span class="clear-btn-text">Clear</span>
          </button>
        </div>
        <div class="history-date-range-grid">
          <div class="history-date-field">
            <label for="historyStartDate" class="history-field-label">From</label>
            <input type="date" id="historyStartDate" class="date-input" title="Start date" aria-label="Start date">
          </div>
          <div class="history-date-field">
            <label for="historyEndDate" class="history-field-label">To</label>
            <input type="date" id="historyEndDate" class="date-input" title="End date" aria-label="End date">
          </div>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="history-stats-grid">
        <div class="history-stat-card">
          <div class="history-stat-icon blue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
            </svg>
          </div>
          <div class="history-stat-info">
            <span class="history-stat-label">Units Sold</span>
            <span class="history-stat-value" id="historyTotalSales">0</span>
          </div>
        </div>

        <div class="history-stat-card">
          <div class="history-stat-icon green">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
            </svg>
          </div>
          <div class="history-stat-info">
            <span class="history-stat-label">Total Profit</span>
            <span class="history-stat-value highlight-green" id="historyTotalProfit">₱0.00</span>
          </div>
        </div>
      </div>

      <!-- Table Section -->
      <div class="history-table-wrapper">
        <div class="history-table-container">
          <table class="history-table">
            <thead>
              <tr>
                <th class="col-date">Date</th>
                <th class="col-qty">Quantity</th>
                <th class="col-price">Price</th>
                <th class="col-subtotal">Subtotal</th>
                <th class="col-customer">Customer</th>
                <th class="col-staff">Sold By</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Sales rows will be inserted here -->
            </tbody>
          </table>

          <div id="historyEmpty" class="history-empty" style="display: none;">
            <div class="history-empty-icon">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
              </svg>
            </div>
            <p class="history-empty-text">No sales history found for this product.</p>
            <p class="history-empty-subtext">Try changing or clearing the date range filter.</p>
          </div>

          <div id="historyLoading" class="history-loading" style="display: none;">
            <div class="history-loading-spinner"></div>
            <p>Loading sales history...</p>
          </div>
        </div>

        <!-- Pagination Controls -->
        <div class="history-pagination" id="historyPagination" style="display: none;">
          <button type="button" class="pagination-btn" id="historyPrevBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
            Previous
          </button>
          <span class="pagination-info" id="historyPageInfo">Page 1 of 1</span>
          <button type="button" class="pagination-btn" id="historyNextBtn" disabled>
            Next
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
