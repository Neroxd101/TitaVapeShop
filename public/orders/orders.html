<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Tita Vape Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/navigation/navigation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/orders/orders.css">
</head>

<body>
    <div class="bg-pattern"></div>

    <!-- Sidebar - Loaded dynamically -->
    <div id="navigation-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="orders-container">
            <div class="page-header">
                <h1>Orders</h1>
                <p class="subtitle">Manage customer orders from catalog</p>
            </div>

            <!-- Filters -->
            <div class="filters-card">
                <div class="filter-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button id="resetFiltersBtn" class="btn btn-secondary">Reset</button>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="orders-table-card">
                <div class="table-responsive">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersList">
                            <!-- Rows rendered by orders_controller.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-controls">
                    <button id="prevPageBtn" class="btn btn-small" disabled>Previous</button>
                    <span id="pageInfo">Page 1</span>
                    <button id="nextPageBtn" class="btn btn-small">Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div id="orderDetailsModal" class="modal-overlay">
        <div class="modal modal-large">
            <div class="modal-header">
                <h3>Order Details</h3>
                <button class="modal-close" id="closeOrderDetailsModal">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="orderDetailsContent">
                    <!-- Order details will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- QR Scanner Modal -->
    <div id="qrScannerModal" class="modal-overlay">
        <div class="modal modal-medium">
            <div class="modal-header">
                <h3>Scan Customer QR Code</h3>
                <button class="modal-close" id="closeQrScannerModal">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="qrScanner" class="qr-scanner-area"></div>
                <p class="qr-help-text">Point the camera at the customer's QR code to verify and complete the order.</p>
            </div>
        </div>
    </div>

    <script src="/navigation/javascript/navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <script src="/orders/javascript/orders_get_all.js"></script>
    <script src="/orders/javascript/orders_controller.js"></script>
</body>

</html>
