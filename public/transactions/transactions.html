<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | Tita Vape Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/transactions/transactions.css">
</head>

<body>
    <div class="bg-pattern"></div>

    <!-- Sidebar - Loaded dynamically -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="transactions-container">
            <div class="page-header">
                <h1>Activity Log</h1>
                <p class="subtitle">Monitor system activities and sales transactions</p>
            </div>

            <!-- Filters -->
            <div class="filters-card">
                <div class="filter-group">
                    <label for="filterAction">Action Type</label>
                    <select id="filterAction">
                        <option value="">All Actions</option>
                        <option value="sale_complete">Sales</option>
                        <option value="inventory_add">Inventory Add</option>
                        <option value="inventory_edit">Inventory Edit</option>
                        <option value="inventory_delete">Inventory Delete</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Date</label>
                    <div class="date-filter-group">
                        <select id="filterMonth" class="date-select">
                            <option value="">Month</option>
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <select id="filterDay" class="date-select">
                            <option value="">Day</option>
                        </select>
                        <select id="filterYear" class="date-select">
                            <option value="">Year</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button id="resetFiltersBtn" class="btn btn-secondary">Reset</button>
                </div>
            </div>

            <!-- Transactions Table -->
            <div class="transactions-table-card">
                <div class="table-responsive">
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Action</th>
                                <th>Details</th>
                                <th>User</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsList">
                            <!-- Rows rendered by transactions.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination / Load More -->
                <div class="pagination-controls">
                    <button id="prevPageBtn" class="btn btn-small" disabled>Previous</button>
                    <span id="pageInfo">Page 1</span>
                    <button id="nextPageBtn" class="btn btn-small">Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/sidebar.js"></script>
    <!-- Modular Fetchers (Align with Backend) -->
    <script src="/transactions/javascript/transactions_get_all.js"></script>
    <script src="/transactions/javascript/transactions_get_stats.js"></script>
    <script src="/transactions/javascript/transactions_get_report.js"></script>
    <script src="/transactions/javascript/transactions_log.js"></script>

    <!-- UI & Controller -->
    <script src="/transactions/javascript/transactions_controller.js"></script>
</body>

</html>
