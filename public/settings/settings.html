<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Tita Vape Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/navigation/navigation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/settings/settings.css">
</head>

<body>
    <div class="bg-pattern"></div>

    <!-- Sidebar - Loaded dynamically -->
    <div id="navigation-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="settings-container">
            <div class="page-header">
                <h1>Settings</h1>
                <p class="subtitle">Manage application configuration and integrations</p>
            </div>

            <div class="settings-grid">
                <!-- Google Integration Card -->
                <div class="card settings-card">
                    <div class="card-header">
                        <div class="header-icon google">
                            <svg viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
                            </svg>
                        </div>
                        <h3>Google Integration</h3>
                    </div>

                    <div class="card-body">
                        <p class="description">Connect your Google account to enable Drive for uploading images and QR
                            code</p>

                        <div id="googleStatusContainer" class="status-container">
                            <!-- Injected by JS -->
                            <div class="loading-spinner"></div>
                        </div>

                        <div id="googleActionContainer" class="action-container">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Account Settings  -->
                <div class="card settings-card">
                    <div class="card-header">
                        <div class="header-icon account">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                            </svg>
                        </div>
                        <h3>Account</h3>
                    </div>
                    <div class="card-body">
                        <p class="description">Manage your profile and security settings.</p>
                        <button class="btn btn-secondary btn-full" disabled>Edit Profile (Coming Soon)</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/navigation/javascript/navigation.js"></script>
    <script src="/settings/settings.js"></script>
</body>

</html>
