<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Tita's Vape Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/components/variables.css">
  <link rel="stylesheet" href="/css/components/resets.css">
  <link rel="stylesheet" href="/css/components/background-effects.css">
  <link rel="stylesheet" href="/css/components/animations.css">
  <link rel="stylesheet" href="/css/components/cards.css">
  <link rel="stylesheet" href="/css/components/forms.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/alerts.css">
  <link rel="stylesheet" href="/css/components/modal.css">
  <link rel="stylesheet" href="/css/components/modal-layouts.css">
  <link rel="stylesheet" href="/css/components/empty-state.css">
  <link rel="stylesheet" href="/css/components/loading-state.css">
  <link rel="stylesheet" href="/css/components/logo.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/navigation/navigation.css">
  <link rel="stylesheet" href="/css/components/main-layout.css">
  <link rel="stylesheet" href="/css/components/page-header.css">
  <link rel="stylesheet" href="/css/components/page-content.css">
  <link rel="stylesheet" href="/css/components/search-box.css">
  <link rel="stylesheet" href="/css/components/filter-tabs.css">
  <link rel="stylesheet" href="/css/components/badges.css">
  <link rel="stylesheet" href="/css/components/stat-cards.css">
  <link rel="stylesheet" href="/css/components/action-cards.css">
  <link rel="stylesheet" href="/css/components/status-indicators.css">
  <link rel="stylesheet" href="/css/components/sections.css">
  <link rel="stylesheet" href="/css/components/table.css">
  <link rel="stylesheet" href="/css/components/pagination.css">
  <link rel="stylesheet" href="/css/components/image-carousel.css">
  <link rel="stylesheet" href="/css/components/image-upload.css">
  <link rel="stylesheet" href="/css/components/detail-view.css">
  <link rel="stylesheet" href="/css/components/history-table.css">
  <link rel="stylesheet" href="/css/components/qr-preview.css">
  <link rel="stylesheet" href="/admin/admin/inventory/inventory-structure.css">
</head>

<body>
  <div class="bg-pattern"></div>

  <!-- Sidebar - Loaded dynamically -->
  <div id="navigation-container"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <h1>Inventory</h1>
        <p class="subtitle">Manage your products and stock</p>
      </div>

      <!-- Filters -->
      <div class="filter-tabs">
        <div class="search-box">
          <svg viewBox="0 0 24 24">
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        <div class="inventory-category-stock">
        <div class="filter-tabs-group">
          <button class="filter-tab active" data-category="all">All</button>
          <button class="filter-tab" data-category="hardware">Hardware</button>
          <button class="filter-tab" data-category="juices">Juices</button>
        </div>
        <select id="stockFilter" class="stock-filter" aria-label="Filter by stock level">
          <option value="all">All Stock</option>
          <option value="low">Low Stock (1–5)</option>
          <option value="none">No Stock (0)</option>
        </select>
        </div>
        <div class="filter-tabs-actions">
          <button type="button" class="btn btn-primary" id="printStocksBtn"><span>Print Stocks</span></button>
          <button class="btn btn-primary" id="addItemBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            <span>Add Item</span>
          </button>
        </div>
      </div>

      <!-- Inventory Grid -->
      <!-- 📋 API Route: GET /admin/admin/inventory/load-items - See API-ROUTES.md -->
      <div class="inventory-grid" id="inventoryGrid">
        <!-- Cards will be loaded here -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path
            d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z" />
        </svg>
        <h3>No items found</h3>
        <p>Add your first product to get started</p>
      </div>

      <!-- Loading State -->
      <div class="loading-state" id="loadingState">
        <div class="spinner-large"></div>
        <p>Loading inventory...</p>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal - Loaded dynamically -->
  <div id="item-modal-container"></div>

  <!-- View Item Modal - Loaded dynamically -->
  <div id="view-modal-container"></div>

  <!-- Delete Confirmation Modal - Loaded dynamically -->
  <div id="delete-modal-container"></div>

  <!-- Sales History Modal - Loaded dynamically -->
  <div id="history-modal-container"></div>

  <script src="/navigation/javascript/navigation.js"></script>
  <!-- Inventory modules - load in dependency order -->

  <!-- Shared Logic -->
  <script src="/transactions/javascript/transactions_log.js"></script>

  <script src="/admin/admin/inventory/javascript/inventory-shared.js"></script>
  <script src="/admin/admin/inventory/javascript/image-handler.js"></script>

  <!-- Refactored Modules -->
  <script src="/admin/admin/inventory/javascript/inventory_get_all.js"></script>
  <script src="/admin/admin/inventory/javascript/inventory_create_item.js"></script>
  <script src="/admin/admin/inventory/javascript/inventory_update_item.js"></script>
  <script src="/admin/admin/inventory/javascript/inventory_delete_item.js"></script>
  <script src="/admin/admin/inventory/javascript/inventory_get_sales_history.js"></script>
  <script src="/admin/admin/inventory/javascript/inventory_print.js"></script>

  <script src="/admin/admin/inventory/javascript/inventory-controller.js"></script>

</body>

</html>
