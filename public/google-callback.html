<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Google Account...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="grid-overlay"></div>

  <div class="login-container">
    <div class="card">
      <div class="logo">
        <h1 class="logo-text">Tita Vape Shop</h1>
        <p>Connecting Google Account...</p>
      </div>

      <div class="callback-content">
        <div class="spinner-large" id="spinner"></div>
        <p class="status-text" id="statusText">Please wait while we connect your Google account...</p>
      </div>

      <div class="alert alert-error" id="errorMessage">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="errorText">An error occurred</span>
      </div>

      <div class="alert alert-success" id="successMessage">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>Google account connected successfully!</span>
      </div>
    </div>
  </div>

  <style>
    .callback-content {
      text-align: center;
      padding: 20px 0;
    }
    
    .status-text {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 16px;
    }
    
    .spinner-large {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
  </style>

  <script>
    async function handleCallback() {
      const spinner = document.getElementById('spinner');
      const statusText = document.getElementById('statusText');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const successMessage = document.getElementById('successMessage');

      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorText.textContent = 'Google authentication was cancelled or failed.';
        errorMessage.classList.add('show');
        setTimeout(() => { window.location.href = '/dashboard'; }, 3000);
        return;
      }

      if (!code) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorText.textContent = 'No authorization code received.';
        errorMessage.classList.add('show');
        setTimeout(() => { window.location.href = '/dashboard'; }, 3000);
        return;
      }

      try {
        // Exchange code for tokens
        const response = await fetch('/auth/google/exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to connect Google account');
        }

        // Store Google tokens
        localStorage.setItem('google_access_token', data.tokens.access_token);
        if (data.tokens.refresh_token) {
          localStorage.setItem('google_refresh_token', data.tokens.refresh_token);
        }
        localStorage.setItem('google_user', JSON.stringify(data.user));
        localStorage.setItem('google_connected', 'true');

        // Show success
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        successMessage.classList.add('show');

        // Redirect back to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1500);

      } catch (err) {
        console.error('Google callback error:', err);
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorText.textContent = err.message;
        errorMessage.classList.add('show');
        
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 3000);
      }
    }

    // Run on page load
    handleCallback();
  </script>
</body>
</html>
