<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal modal-large">
        <div class="modal-header">
            <h3>Shopping Cart</h3>
            <button class="modal-close" id="closeCartModal">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="cart-container">
                <div class="cart-empty-state" role="status">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M3 3h2l3 12h11l2-9H6M9 20h.01M18 20h.01" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <h3>Your cart is empty</h3>
                    <p>There are no items in your cart.</p>
                    <button type="button" id="closeEmptyCartBtn" class="btn btn-secondary">Close</button>
                </div>
                <div id="cartItems" class="cart-items">
                    <!-- Cart items will be rendered here -->
                </div>
                <div class="cart-summary">
                    <div class="cart-summary-row">
                        <span>Total:</span>
                        <span class="cart-total-amount" id="cartTotal">₱0.00</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button id="clearCartBtn" class="btn btn-secondary">Clear</button>
                    <button id="nextToCheckoutBtn" class="btn btn-primary">Next</button>
                </div>
            </div>
        </div>
    </div>
</div>
