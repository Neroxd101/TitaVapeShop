<!-- Add/Edit Modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="modalTitle">Add New Item</h3>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <!-- 📋 API Route: POST /inventory/create-item | PUT /inventory/update-item -->
    <!-- See API-ROUTES.md for details -->
    <form id="itemForm" class="modal-form-horizontal" action="/inventory/create-item" method="POST" data-api-route-create="/inventory/create-item" data-api-route-update="/inventory/update-item">
      <input type="hidden" id="itemId" name="id">
      
      <!-- Left Column - Images -->
      <div class="modal-col modal-col-images">
        <div class="form-group">
          <label>Product Images <span class="label-hint">(up to 5)</span></label>
          <div class="images-grid" id="imagesGrid">
            <!-- Image previews will be added here -->
          </div>
          <div class="image-upload-bar">
            <label class="btn btn-secondary btn-upload" for="itemImages">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
              <span>Add Images</span>
            </label>
            <input type="file" id="itemImages" accept="image/*" multiple style="display: none;">
            <p class="image-hint" id="imageHint">JPG, PNG up to 5MB</p>
            <p class="image-uploading" id="imageUploading" style="display: none;">
              <span class="spinner-small"></span> Uploading...
            </p>
          </div>
        </div>

        <div class="form-group qr-group" id="qrGroup" style="display: none;">
          <label>QR Code</label>
          <div class="qr-preview" id="qrPreview">
            <svg viewBox="0 0 24 24">
              <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13 2h-2v2h2v2h-4v-4h2v-2h-2v-2h4v4zm2-4v2h2v4h-2v2h-2v-4h2v-2h-2v-2h2z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Right Column - Form Fields -->
      <div class="modal-col modal-col-fields">
        <div class="form-row-2">
          <div class="form-group">
            <label for="itemCategory">Category</label>
            <select id="itemCategory" required>
              <option value="">Select category</option>
              <option value="hardware">Hardware</option>
              <option value="juices">Juices</option>
            </select>
          </div>
          <div class="form-group">
            <label for="itemQuantity">Quantity</label>
            <input type="number" id="itemQuantity" placeholder="0" min="0" required>
          </div>
        </div>

        <div class="form-group">
          <label for="itemName">Product Name</label>
          <input type="text" id="itemName" placeholder="Enter product name" required>
        </div>

        <div class="form-group">
          <label for="itemDescription">Description <span class="label-hint">(optional)</span></label>
          <textarea id="itemDescription" placeholder="Enter product description..." rows="2"></textarea>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="itemCostPrice">Cost Price (₱)</label>
            <input type="number" id="itemCostPrice" placeholder="0.00" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="itemSalePrice">Sale Price (₱)</label>
            <input type="number" id="itemSalePrice" placeholder="0.00" min="0" step="0.01" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <span class="btn-text">Save Item</span>
            <div class="spinner"></div>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
