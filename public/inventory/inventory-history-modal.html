<!-- Sales History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3>Sales History</h3>
      <div class="history-date-filter">
        <select id="historyMonthFilter" class="date-select">
          <option value="">Month</option>
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <option value="04">April</option>
          <option value="05">May</option>
          <option value="06">June</option>
          <option value="07">July</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
        <select id="historyDayFilter" class="date-select">
          <option value="">Day</option>
        </select>
        <select id="historyYearFilter" class="date-select">
          <option value="">Year</option>
        </select>
      </div>
    </div>

    <div class="modal-body">
      <div class="history-header">
        <div class="history-header-left">
          <h4 id="historyProductName">Product Name</h4>
        </div>
        <div class="history-header-right">
          <div class="history-stats">
            <div class="history-stat">
              <span class="stat-label">Total Sales</span>
              <span class="stat-value" id="historyTotalSales">0</span>
            </div>
            <div class="history-stat">
              <span class="stat-label">Total Revenue</span>
              <span class="stat-value highlight" id="historyTotalRevenue">₱0.00</span>
            </div>
            <div class="history-stat">
              <span class="stat-label">Margin %</span>
              <span class="stat-value highlight" id="historyMarginPercent">0%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="history-table-container">
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Subtotal</th>
              <th>Customer</th>
              <th>Sold By</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <!-- Sales rows will be inserted here -->
          </tbody>
        </table>
        <div id="historyEmpty" class="history-empty" style="display: none;">
          <p>No sales history found for this product.</p>
        </div>
        <div id="historyLoading" class="history-loading" style="display: none;">
          <p>Loading sales history...</p>
        </div>
      </div>
    </div>
  </div>
</div>
