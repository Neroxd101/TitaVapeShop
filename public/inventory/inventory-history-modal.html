<!-- Sales History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="historyProductName">Product Name</h3>
      <div class="history-date-filter">
        <select id="historyYearFilter" class="date-select">
          <option value="">Year</option>
        </select>
        <select id="historyMonthFilter" class="date-select">
          <option value="">Month</option>
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <option value="04">April</option>
          <option value="05">May</option>
          <option value="06">June</option>
          <option value="07">July</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
        <select id="historyDayFilter" class="date-select">
          <option value="">Day</option>
        </select>
      </div>
    </div>

    <div class="modal-body">
      <div class="history-stats-container">
        <div class="history-stats">
          <div class="history-stat">
            <span class="stat-label">Total Sales</span>
            <span class="stat-value" id="historyTotalSales">0</span>
          </div>
          <div class="history-stat">
            <span class="stat-label">Total Revenue</span>
            <span class="stat-value highlight" id="historyTotalRevenue">₱0.00</span>
          </div>
          <div class="history-stat">
            <span class="stat-label">Margin %</span>
            <span class="stat-value highlight" id="historyMarginPercent">0%</span>
          </div>
        </div>
      </div>

      <div class="history-table-container">
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Subtotal</th>
              <th>Customer</th>
              <th>Sold By</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <!-- Sales rows will be inserted here -->
          </tbody>
        </table>
        <div id="historyEmpty" class="history-empty" style="display: none;">
          <p>No sales history found for this product.</p>
        </div>
        <div id="historyLoading" class="history-loading" style="display: none;">
          <p>Loading sales history...</p>
        </div>
        
        <!-- Pagination Controls -->
        <div class="history-pagination" id="historyPagination" style="display: none;">
          <button class="pagination-btn" id="historyPrevBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
            Previous
          </button>
          <span class="pagination-info" id="historyPageInfo">Page 1 of 1</span>
          <button class="pagination-btn" id="historyNextBtn" disabled>
            Next
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
