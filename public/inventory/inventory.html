<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Tita Vape Shop</title>
  <!-- 📋 API Routes: See API-ROUTES.md for complete reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/inventory/inventory.css">
</head>
<body>
  <div class="bg-pattern"></div>
  
  <!-- Sidebar - Loaded dynamically -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="main-content">
    <header class="main-header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <h2>Inventory</h2>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" id="addItemBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>Add Item</span>
        </button>
      </div>
    </header>

    <div class="inventory-content">
      <!-- Filters -->
      <div class="filters-bar">
        <div class="search-box">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-category="all">All</button>
          <button class="filter-tab" data-category="hardware">Hardware</button>
          <button class="filter-tab" data-category="juices">Juices</button>
        </div>
      </div>

      <!-- Inventory Grid -->
      <!-- 📋 API Route: GET /inventory/load-items - See API-ROUTES.md -->
      <div class="inventory-grid" id="inventoryGrid">
        <!-- Cards will be loaded here -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z"/>
        </svg>
        <h3>No items found</h3>
        <p>Add your first product to get started</p>
      </div>

      <!-- Loading State -->
      <div class="loading-state" id="loadingState">
        <div class="spinner-large"></div>
        <p>Loading inventory...</p>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal - Loaded dynamically -->
  <div id="item-modal-container"></div>

  <!-- View Item Modal - Loaded dynamically -->
  <div id="view-modal-container"></div>

  <!-- Delete Confirmation Modal - Loaded dynamically -->
  <div id="delete-modal-container"></div>

  <script src="/js/sidebar.js"></script>
  <!-- Inventory modules - load in dependency order -->
  <script src="/inventory/javascript/google.js"></script>
  <script src="/inventory/javascript/utils.js"></script>
  <script src="/inventory/javascript/state.js"></script>
  <script src="/inventory/javascript/dom-elements.js"></script>
  <script src="/inventory/javascript/image-handler.js"></script>
  <script src="/inventory/javascript/card-renderer.js"></script>
  <script src="/inventory/javascript/modal-handler.js"></script>
  <script src="/inventory/javascript/api.js"></script>
  <script src="/inventory/javascript/inventory.js"></script>
</body>
</html>
