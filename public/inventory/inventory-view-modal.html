<!-- View Item Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal modal-wide">
    <div class="view-modal-content">
      <!-- Right Column - Images Gallery -->
      <div class="view-col view-col-images">
        <div class="view-main-image" id="viewMainImage">
          <img src="" alt="Product Image">
        </div>
        <div class="view-thumbnails" id="viewThumbnails">
          <!-- Thumbnails will be added here -->
        </div>
      </div>

      <!-- Let Column - Details -->
      <div class="view-col view-col-details">
        <div class="view-category" id="viewCategory">Hardware</div>
        <h2 class="view-name" id="viewName">Product Name</h2>
        <p class="view-description" id="viewDescription"></p>

        <div class="view-stats">
          <div class="view-stat">
            <span class="stat-label">Quantity</span>
            <span class="stat-value" id="viewQuantity">0</span>
          </div>
          <div class="view-stat">
            <span class="stat-label">Cost Price</span>
            <span class="stat-value" id="viewCostPrice">₱0.00</span>
          </div>
          <div class="view-stat">
            <span class="stat-label">Sale Price</span>
            <span class="stat-value highlight" id="viewSalePrice">₱0.00</span>
          </div>
          <div class="view-stat">
            <span class="stat-label">Profit</span>
            <span class="stat-value profit" id="viewProfit">₱0.00</span>
          </div>
          <div class="view-stat">
            <span class="stat-label">Added</span>
            <span class="stat-value" id="viewCreatedAt">-</span>
          </div>
          <div class="view-stat">
            <span class="stat-label">Last Updated</span>
            <span class="stat-value" id="viewUpdatedAt">-</span>
          </div>
        </div>

        <div class="view-actions">
          <!-- Position 1: Generate QR (unchanged) -->
          <button type="button" class="btn btn-secondary" id="viewGenerateQrBtn">
            <span class="btn-text" style="display: flex; align-items: center; gap: 10px;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path
                  d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13 2h-2v2h2v2h-4v-4h2v-2h-2v-2h4v4zm2-4v2h2v4h-2v2h-2v-4h2v-2h-2v-2h2z" />
              </svg>
              Generate QR
            </span>
            <div class="spinner"></div>
          </button>

          <!-- Position 2: Edit (moved to History's old position) -->
          <button type="button" class="btn btn-secondary" id="viewEditBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
            </svg>
            Edit
          </button>

          <!-- Position 3: Delete (moved to Edit's old position) -->
          <button type="button" class="btn btn-danger" id="viewDeleteBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
            Delete
          </button>

          <!-- Position 4: History (moved to Delete's old position) -->
          <button type="button" class="btn btn-secondary" id="viewHistoryBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
            History
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
