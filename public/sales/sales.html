<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales POS | Tita Vape Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/sales/sales.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <!-- Sidebar - Loaded dynamically -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="main-content">
    <header class="main-header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <h2>Sales (POS)</h2>
      </div>
      <div class="header-right">
        <div id="googleStatus"></div>
        <span class="current-date" id="currentDate"></span>
        <button class="btn btn-primary" id="openCartModalBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span>Checkout</span>
          <span id="cartBadge" class="cart-badge">0</span>
        </button>
      </div>
    </header>

    <section class="pos-layout">
      <!-- Product list / catalog -->
      <div class="pos-column pos-products">
        <div class="pos-panel">
          <div class="pos-panel-header">
            <div class="pos-search">
              <input type="text" id="productSearch" placeholder="Search products by name or category">
            </div>
            <div class="pos-filter">
              <select id="productCategoryFilter">
                <option value="">All categories</option>
                <option value="hardware">Hardware</option>
                <option value="juices">Juices</option>
              </select>
            </div>
            <button type="button" class="pos-qr-btn" id="openQrModalBtn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h-2v2h2v2h2v-4h-2zm4 0v2h2v-2h-2zm0 4v2h2v-2h-2z"/>
              </svg>
              <span>Scan QR</span>
            </button>
          </div>

          <div class="pos-panel-body">
            <div id="productList" class="product-list">
              <!-- Products rendered by sales.js -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scan QR Modal -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal modal-small">
      <div class="modal-header">
        <h3>Scan Product QR</h3>
        <button class="modal-close" id="closeQrModalBtn">
          <svg viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="qrScanner" class="qr-scanner-area"></div>
        <p class="qr-help-text">Point the camera at a product QR code to add it to the cart.</p>
      </div>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/inventory/javascript/utils.js"></script>
  <script src="/inventory/javascript/google.js"></script>
  <script src="/inventory/javascript/image-handler.js"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="/sales/sales.js"></script>
</body>
</html>
