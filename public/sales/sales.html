<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales POS | Tita Vape Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/sales/sales.css">
</head>

<body>
  <div class="bg-pattern"></div>

  <!-- Sidebar - Loaded dynamically -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="main-content">
    <header class="main-header"></header>

    <section class="pos-layout">
      <!-- Product list / catalog -->
      <div class="pos-column pos-products">
        <div class="pos-panel">
          <div class="pos-panel-header">
            <div class="pos-search">
              <input type="text" id="productSearch" placeholder="Search products by name or category">
            </div>
            <div class="pos-filter">
              <select id="productCategoryFilter">
                <option value="">All categories</option>
                <option value="hardware">Hardware</option>
                <option value="juices">Juices</option>
              </select>
            </div>
            <button type="button" class="pos-qr-btn" id="openQrModalBtn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path
                  d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h-2v2h2v2h2v-4h-2zm4 0v2h2v-2h-2zm0 4v2h2v-2h-2z" />
              </svg>
              <span>Scan QR</span>
            </button>
          </div>

          <div class="pos-panel-body">
            <div id="productList" class="product-list">
              <!-- Products rendered by sales.js -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scan QR Modal -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal modal-small">
      <div class="modal-header">
        <h3>Scan Product QR</h3>
        <button class="modal-close" id="closeQrModalBtn">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="qrScanner" class="qr-scanner-area"></div>
        <p class="qr-help-text">Point the camera at a product QR code to add it to the cart.</p>
      </div>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/main-header.js"></script>
  <script src="/js/header-status.js"></script>
  <script src="/transactions/javascript/transaction-logger.js"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <!-- Inventory logic reused (state, utils, image helper) -->
  <script src="/inventory/javascript/inventory-shared.js"></script>
  <script src="/inventory/javascript/image-handler.js"></script>

  <!-- Sales modules -->
  <script src="/sales/javascript/sales-qr.js"></script>
  <script src="/sales/javascript/load-sales.js"></script>
  <script src="/sales/javascript/sales-cart.js"></script>
  <script src="/sales/javascript/create-sale.js"></script>

  <script src="/sales/javascript/sales-controller.js"></script>
</body>

</html>
