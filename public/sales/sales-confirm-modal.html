<!-- Confirmation Modal -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal modal-small">
        <div class="modal-header">
            <h3>Confirm Sale</h3>
            <button class="modal-close" id="closeConfirmModalBtn">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom: 16px;">Are you sure you want to complete this sale?</p>
            <div class="confirm-details">
                <div class="confirm-row">
                    <span class="text-muted">Customer:</span>
                    <span id="confirmCustomer">Walk-in</span>
                </div>
                <div class="confirm-row">
                    <span class="text-muted">Total:</span>
                    <strong id="confirmTotal" style="color: var(--accent);">₱0.00</strong>
                </div>
                <div class="confirm-row">
                    <span class="text-muted">Cash:</span>
                    <span id="confirmCash">₱0.00</span>
                </div>
                <div class="confirm-row">
                    <span class="text-muted">Change:</span>
                    <span id="confirmChange">₱0.00</span>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="cancelConfirmBtn">Cancel</button>
            <button class="btn btn-primary" id="proceedSaleBtn">
                <span class="btn-text">Complete Sale</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>
</div>
