<!-- Current Sale Modal -->
<div class="modal-overlay" id="cartModal">
  <div class="modal modal-large">
    <div class="modal-header">
      <h3>Current Sale</h3>
      <button class="modal-close" id="closeCartModalBtn">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="cartEmptyState" class="cart-empty">
        <p>No items in the cart yet.</p>
        <p class="cart-empty-sub">Search products and add them to start a sale.</p>
      </div>

      <div id="cartContainer" class="cart-container" style="display:none;">
        <div class="cart-items" id="cartItems">
          <!-- Cart rows rendered by sales.js -->
        </div>

        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>Items</span>
            <span id="cartItemsCount">0</span>
          </div>
          <div class="cart-summary-row">
            <span>Subtotal</span>
            <span id="cartSubtotal">₱0.00</span>
          </div>
          <div class="cart-summary-row">
            <span>Total</span>
            <span id="cartTotal" class="cart-total-amount">₱0.00</span>
          </div>
        </div>

        <div class="cart-payment">
          <div class="form-group">
            <label for="customerName">Customer Name (optional)</label>
            <input type="text" id="customerName" placeholder="Walk-in">
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="cashInput">Cash</label>
              <input type="number" id="cashInput" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
              <label>Change</label>
              <div id="changeDisplay" class="change-display">₱0.00</div>
            </div>
          </div>
        </div>

        <div class="cart-actions">
          <button type="button" class="btn btn-secondary" id="clearCartBtn">Clear</button>
          <button type="button" class="btn btn-primary" id="completeSaleBtn">Complete Sale</button>
        </div>
      </div>
    </div>
  </div>
</div>
